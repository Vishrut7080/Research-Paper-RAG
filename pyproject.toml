description = "ResearchMate — RAG research assistant with web search, FastAPI backend and React frontend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "fonttools>=4.65.0",
    "groq>=1.7.0",
    "numpy>=2.5.3",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "requests>=2.32.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.32.0",
]
